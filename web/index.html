<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cubewarden</title>
<link rel="help" type="text/plain" href="llms.txt" title="For agents: how to use this page">
<style>
:root{
  --paper:#FFFFFF; --chrome:#F1F3F6; --chrome-2:#E6E9EE; --ink:#1A2130; --ink-2:#556071; --ink-3:#8790A0;
  --line:#E2E5EA; --line-2:#CDD2D9;
  --accent:#2546C9; --accent-tint:#E9EEFD; --accent-2:#1A35A3;
  --mark:#FFE47A; --mark-edge:#E2B300; --bad:#FFD7D1; --bad-edge:#D9483B;
  --ok:#1D8048; --near:#B66C00; --fail:#C1352B; --none:#8790A0; --nodata:#5F6B85; --error:#8B3FB5; --warn:#B66C00;
  --mW:#F7F0D4; --mU:#A7D2EE; --mB:#BFB5B1; --mR:#F19E7D; --mG:#94CDA4; --mC:#D8D4CF;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 var(--sans);color:var(--ink);background:var(--chrome);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
kbd{font:600 10.5px/1 var(--sans);padding:2px 4px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;color:var(--ink-2);background:var(--paper);white-space:nowrap}
.muted{color:var(--ink-3)}
.hidden{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line-2);background:var(--paper);border-radius:6px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--chrome)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--chrome-2)}
.btn.danger{color:var(--fail)}
.btn.danger.armed{background:var(--fail);color:#fff;border-color:var(--fail)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;height:26px;padding:0 10px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button.on{background:var(--ink);color:#fff}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--chrome-2);font-size:11px;font-weight:600;color:var(--ink-2)}
.badge.dirty{background:var(--accent);color:#fff}

/* layout */
#app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:48px;flex-wrap:wrap;background:var(--paper);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;margin-right:6px;white-space:nowrap}
.brand svg{flex:none}
.top .sizeinfo{color:var(--ink-2);font-size:12px;white-space:nowrap}
.top .sizeinfo b{color:var(--ink);font-variant-numeric:tabular-nums}
.spacer{flex:1}
.body{display:grid;grid-template-columns:304px minmax(0,1fr) auto;min-height:0}
.side{overflow:auto;background:var(--chrome);border-right:1px solid var(--line);padding:6px 8px 40px}
.main{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;min-width:0;min-height:0;background:var(--paper)}
.tablewrap{overflow:auto;min-height:0;position:relative}
.drawer{width:468px;border-left:1px solid var(--line);background:var(--paper);overflow:auto;display:none;min-height:0}
.drawer.open{display:block}
@media (max-width:1340px){.body{grid-template-columns:270px minmax(0,1fr) auto}.drawer{width:430px}}

/* status glyphs */
.st{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;vertical-align:middle}
.st.ok{background:var(--ok)}
.st.near{background:var(--near);border-radius:2px}
.st.fail{background:var(--fail);width:8px;height:8px;border-radius:1px;transform:rotate(45deg)}
.st.none{box-shadow:inset 0 0 0 1.5px var(--none)}
.st.nodata{box-shadow:inset 0 0 0 1.5px var(--nodata);background:repeating-linear-gradient(45deg,transparent 0 2px,var(--nodata) 2px 3px)}
.st.error{background:var(--error);border-radius:2px}
.st.warn{width:0;height:0;border-radius:0;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:9px solid var(--warn)}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:#E2F2E8;color:var(--ok)} .pill.near{background:#FBEFD9;color:var(--near)} .pill.fail{background:#FBE3E0;color:var(--fail)}
.pill.none{background:var(--chrome);color:var(--ink-2)} .pill.nodata{background:var(--chrome);color:var(--nodata)} .pill.error{background:#F1E5F8;color:var(--error)}
.pill.warn{background:#FBEFD9;color:var(--warn)}
.warnmark{color:var(--warn);font-weight:700;font-size:11px}

/* mana */
.pip{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;font:700 8.5px/1 var(--sans);font-style:normal;color:rgba(20,20,20,.75);box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);margin-right:1px;vertical-align:-3px;background:var(--mC)}
.pip.mW{background:var(--mW)}.pip.mU{background:var(--mU)}.pip.mB{background:var(--mB)}.pip.mR{background:var(--mR)}.pip.mG{background:var(--mG)}
.pip.hy{background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%)}
.pip.mC{background:#DCD8D2;font-size:9px}.pip.mL{background:#C9B79A;font-size:8.5px;border-radius:3px}
.pip.lg.mC{font-size:12px}.pip.lg.mL{font-size:11px}
.pip.gen{background:#E4E1DC}
.pip.sm{width:11px;height:11px;font-size:0;vertical-align:-1px}
.pip.lg{width:22px;height:22px;font-size:11px}
.facesep{color:var(--ink-3);margin:0 3px;font-size:11px}

/* sidebar tree */
.tree-h{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 4px;color:var(--ink-2);font-size:12px;font-weight:600}
.node{display:flex;align-items:center;gap:7px;width:100%;border:0;background:none;padding:5px 8px;border-radius:6px;text-align:left;min-height:28px}
.node:hover{background:var(--chrome-2)}
.node.on{background:var(--paper);box-shadow:0 0 0 1px var(--line-2)}
.node .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .nm.unnamed{font-style:italic;color:var(--ink-3)}
.node .ct{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.node .pips{display:inline-flex;flex:none}
.kids{margin:2px 0 8px 15px;padding:2px 0 2px 8px;border-left:2px solid var(--line-2)}
.kh{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 2px;font-size:11.5px;color:var(--ink-3);font-weight:600}
.kh button{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;padding:2px 4px;border-radius:4px}
.kh button:hover{background:var(--chrome-2)}
.item{display:grid;grid-template-columns:11px minmax(0,1fr) 22px;grid-template-areas:"st nm ed" ". v ed";align-items:center;column-gap:6px;padding:4px 4px 4px 6px;border-radius:5px;cursor:pointer}
.item>.st{grid-area:st}.item>.nm{grid-area:nm}.item>.v{grid-area:v}.item>.ed{grid-area:ed}
.item:hover{background:var(--chrome-2)}
.item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm .sec{color:var(--ink-3);font-size:11px;margin-left:4px}
.item .v{font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.item .v b{color:var(--ink);font-weight:600}
.refv{display:block;color:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.item.on .refv{color:rgba(255,255,255,.6)}
.refs{font-size:12px;color:var(--ink-2)}.refs b{color:var(--ink);font-variant-numeric:tabular-nums}
.rtext{font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:1px 6px;overflow-wrap:anywhere}
.scry{display:inline-flex;align-items:center;gap:6px;font-size:12px;flex-wrap:wrap}
.scry a{color:var(--accent);font-weight:600;text-decoration:none}.scry a:hover{text-decoration:underline}
.scry .skip{color:var(--ink-3)}
.item.on .v,.item.on .v b{color:#fff}
.item .v small{color:var(--ink-3);font-size:11px;margin-left:3px}
.item .ed{border:0;background:none;width:22px;height:22px;border-radius:4px;color:var(--ink-3);visibility:hidden}
.item:hover .ed,.item.on .ed{visibility:visible}
.item .ed:hover{background:rgba(0,0,0,.08)}
.item.on{background:var(--ink);color:#fff}
.item.on .nm .sec,.item.on .v small,.item.on .ed{color:rgba(255,255,255,.7)}
.item.drafting{box-shadow:inset 0 0 0 1.5px var(--accent)}
.kempty{padding:3px 6px;color:var(--ink-3);font-size:12px}

/* scope head */
.shead{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.shead-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shead h1{font:650 18px/1.2 var(--sans);margin:0;display:flex;align-items:center;gap:8px}
.shead .meta{color:var(--ink-2);font-size:12px}
.rulebox{margin-top:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:start;padding:10px 12px;background:var(--chrome);border-radius:8px}
.rulebox .rname{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:14px}
.rulebox .rname .kind{font-weight:400;color:var(--ink-2);font-size:12px}
.rulebox .rdesc{grid-column:1/-1;color:var(--ink-2);font-size:12px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rulebox .rdesc:hover{-webkit-line-clamp:unset}
.rlinks{grid-column:1/-1;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.astext{font-size:12px}
.mono,textarea.mono{font:12.5px/1.45 ui-monospace,Menlo,monospace}
.cheat summary{cursor:pointer;font-size:12px;color:var(--accent);font-weight:600}
.cheat p{font-size:12px;color:var(--ink-2);margin:6px 0}
.cheat table{font-size:12px;border-collapse:collapse}.cheat td{padding:2px 8px 2px 0;vertical-align:top;color:var(--ink-2)}
.cheat code,.check-matches code{font:11.5px ui-monospace,Menlo,monospace;color:var(--ink)}
select.unitsel{width:auto}
.rulebox .rcut{grid-column:1/-1;font-size:12px;margin-top:-4px}
.rulebox .ract{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stats{grid-column:1/-1;display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat b{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11.5px;color:var(--ink-2)}
.stat .vs{font-size:12px;color:var(--ink-2);font-weight:500}
.curve{display:flex;align-items:flex-end;gap:10px}
.scopestat{min-width:96px}
.pip.shared-ic{background:var(--ink);color:#fff;font-size:11px}
.pip.lg.shared-ic{font-size:15px}
.item .nm .shr{font-size:10.5px;margin-left:5px;padding:0 5px;border-radius:7px;background:var(--accent-tint);color:var(--accent);font-weight:600}
.item.on .nm .shr{background:rgba(255,255,255,.2);color:#fff}
.desc{margin:6px 0 0;font-size:13px;color:var(--ink-2);max-width:78ch;border-radius:6px;padding:3px 6px;margin-left:-6px;cursor:text}
.desc:hover{background:var(--chrome)}
.desc.empty{color:var(--ink-3);font-style:italic}
.desc:not(.editing){display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.desc:not(.editing):hover,.desc:not(.editing):focus{-webkit-line-clamp:unset}
.top .seg,.top .btn{flex:none}
.desc p{margin:0 0 4px}.desc ul{margin:0 0 4px;padding-left:18px}.desc h1,.desc h2,.desc h3,.desc h4{margin:4px 0;font-size:13.5px;color:var(--ink)}
.desc.editing{cursor:default;background:none;max-width:none}
.desc.editing textarea{width:100%;max-width:78ch;display:block}
.rnote{grid-column:1/-1;font-size:12.5px;color:var(--ink);margin-top:-4px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.schip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 7px 0 5px;border-radius:12px;border:1px solid var(--line-2);background:var(--paper);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.schip .pp{display:inline-flex}
.schip b{font-size:11px}
.schip.ok{border-color:#B7DCC5}.schip.ok b{color:var(--ok)}
.schip.fail{border-color:#F0BDB7;background:#FFF5F4}.schip.fail b{color:var(--fail)}
.schip.near,.schip.warn{border-color:#EDD3A6;background:#FFFAF0}.schip.near b,.schip.warn b{color:var(--near)}
.schip.error{border-color:#D9C2EA}.schip:hover{border-color:var(--ink-2)}
.shared-list{display:flex;flex-direction:column;gap:10px}
.srow-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.srow-n{border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.srow-n:hover b{text-decoration:underline}
.srow-c{margin-left:auto;color:var(--ink-2);font-size:12px}
.srow-d{font-size:12px;color:var(--ink-2);margin-top:2px}
.shared-empty{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctog.scoped button:not(.scopechip){opacity:.2}
.chip.scopechip{margin-left:4px;height:22px}
.vsep{align-self:stretch;width:1px;background:var(--line-2)}
.lights{display:flex;flex-wrap:wrap;gap:1px;margin-top:4px;max-width:200px}
.light{border:0;background:none;padding:1px;border-radius:50%;line-height:0;cursor:pointer}
.light svg{display:block}
.light:hover{background:var(--chrome-2)}
.light.on{box-shadow:0 0 0 1.5px var(--ink)}
/* card view */
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:16px 14px;padding:16px 18px 28px}
.cg{position:relative;cursor:pointer;user-select:none;border-radius:9px}
.cg img{display:block;width:100%;aspect-ratio:488/680;border-radius:7px;background:var(--chrome-2);object-fit:cover}
.cg .ring{position:absolute;left:-4px;right:-4px;top:-4px;aspect-ratio:auto;height:calc(100% - 22px + 8px);border-radius:11px;pointer-events:none}
.cg.pass .ring{box-shadow:0 0 0 3px var(--ok)}
.cg.cut .ring{box-shadow:0 0 0 3px var(--fail)}
.cg.sel{outline:3px solid var(--accent);outline-offset:7px}
.cg.focus:not(.sel){outline:2px dashed var(--ink-2);outline-offset:7px}
.cg .chk{position:absolute;top:7px;right:7px;opacity:0;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);border:1.5px solid rgba(0,0,0,.25);display:grid;place-items:center;font:700 14px/1 var(--sans);color:transparent;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cg:hover .chk{opacity:1;border-color:var(--accent)}
.cg.sel .chk{opacity:1;background:var(--accent);border:2px solid #fff;color:#fff}
.cg .cap{display:flex;justify-content:space-between;gap:6px;height:22px;align-items:flex-end;font-size:11.5px;color:var(--ink-2);padding:0 2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.cg .cap>span:last-child{overflow:hidden;text-overflow:ellipsis}
.cg .tag{font:700 10.5px/1 var(--sans);padding:3px 6px;border-radius:8px;color:#fff;flex:none}
.cg.pass .tag{background:var(--ok)} .cg.cut .tag{background:var(--fail)}
.curve svg{display:block}
.legend{display:flex;gap:10px;font-size:11px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{position:relative}
.search{flex:1 1 220px;max-width:340px;min-width:160px}
.search input{height:28px;width:100%;border:1px solid var(--line-2);border-radius:6px;padding:0 30px 0 9px;background:var(--paper)}
.search kbd{position:absolute;right:7px;top:6px}
.tcount{color:var(--ink-2);font-size:12px;margin-left:auto;white-space:nowrap}
.btn.filtered{background:#FFF4CC;border-color:var(--mark-edge)}

/* table */
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:860px;table-layout:fixed;font-variant-numeric:tabular-nums}
.grid th{position:sticky;top:0;z-index:2;background:var(--chrome);font-weight:600;font-size:12px;color:var(--ink-2);text-align:left;padding:0 8px;height:30px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.grid th.sortable{cursor:pointer}
.grid th.sortable:hover{background:var(--chrome-2);color:var(--ink)}
.grid th .arr{color:var(--accent);margin-left:3px}
.grid th.num,.grid td.num{text-align:right}
.grid th.valh{background:#FFF6D1;color:var(--ink)}
.grid th .info{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--line-2);font:600 9px/1 var(--sans);color:var(--ink-3);margin-left:4px;cursor:help;vertical-align:1px}
.grid td{height:30px;padding:0 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid tbody tr{cursor:default}
.grid tbody tr:hover td{background:#F7F8FA}
.grid td.c-chk,.grid th.c-chk{text-align:center;padding:0}
.grid th.c-chk{width:34px}.grid th.c-cc{width:70px}.grid th.c-tags{width:160px}.grid td.c-tags{font-size:12px;color:var(--ink-2)}.grid th.c-name{width:200px}.grid th.c-cost{width:90px}.grid th.c-mv{width:42px}.grid th.c-col{width:68px}.grid th.c-set{width:52px}.grid th.c-wr{width:84px}.grid th.c-val{width:128px}
.grid th.c-val,.grid td.c-val{position:sticky;right:0;box-shadow:-1px 0 0 var(--line-2)}
.grid th.c-val{z-index:3}
.grid td.c-val{background:var(--paper)}
/* table columns hide by priority as the list gets narrower; the value column always stays */
table.grid.w-m,table.grid.w-s,table.grid.w-xs{min-width:0}
.grid.w-m .c-set,.grid.w-m .c-col,.grid.w-m .c-cc,.grid.w-m .c-tags{display:none}
.grid.w-s .c-set,.grid.w-s .c-col,.grid.w-s .c-cc,.grid.w-s .c-tags,.grid.w-s .c-type,.grid.w-s .c-wr2{display:none}
.grid.w-xs .c-set,.grid.w-xs .c-col,.grid.w-xs .c-cc,.grid.w-xs .c-tags,.grid.w-xs .c-type,.grid.w-xs .c-wr2,.grid.w-xs .c-mv,.grid.w-xs .c-cost{display:none}
.grid.w-m th.c-name,.grid.w-s th.c-name,.grid.w-xs th.c-name{width:auto}
.grid.w-s th.c-cost{width:78px}.grid.w-s th.c-wr,.grid.w-xs th.c-wr{width:66px}.grid.w-xs th.c-val{width:112px}
.grid input[type=checkbox]{width:14px;height:14px;margin:0;accent-color:var(--accent);cursor:pointer}
.grid .nm{font:600 13.5px/1 var(--serif);letter-spacing:.005em}
.grid td.c-type{color:var(--ink-2)}
.grid td.c-set{color:var(--ink-2);font-size:12px;text-transform:uppercase}
.grid .nd{color:var(--ink-3);font-size:11.5px;font-style:italic}
.grid tr.sel td{background:var(--accent-tint)}
.grid tr.sel:hover td{background:#DFE6FC}
.grid tr.focus{outline:2px solid var(--accent);outline-offset:-2px}
.grid tr.hit td.c-chk{box-shadow:inset 3px 0 0 var(--mark-edge)}
.grid tr.hit .nm{background:linear-gradient(transparent 8%,var(--mark) 8%,var(--mark) 92%,transparent 92%);padding:0 3px;margin:0 -3px;border-radius:2px}
.grid tr.hit td.c-val{background:#FFF8DB}
.grid tr.bad td.c-chk{box-shadow:inset 3px 0 0 var(--bad-edge)}
.grid tr.bad .nm{background:linear-gradient(transparent 8%,var(--bad) 8%,var(--bad) 92%,transparent 92%);padding:0 3px;margin:0 -3px;border-radius:2px}
.grid tr.bad td.c-val{background:#FFF0EE}
.v-yes{color:var(--ok);font-weight:600}.v-no{color:var(--ink-3)}.v-bad{color:var(--fail);font-weight:600}.v-err{color:var(--error)}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

/* action bar */
.actionbar{display:none;align-items:center;gap:8px;padding:8px 16px;background:var(--ink);color:#fff;flex-wrap:wrap}
.actionbar.on{display:flex}
.actionbar .n{font-weight:650;margin-right:6px}
.actionbar .sub{color:rgba(255,255,255,.65);font-size:12px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.actionbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.actionbar .btn:hover{background:rgba(255,255,255,.2)}
.actionbar .btn.primary{background:#fff;color:var(--ink);border-color:#fff}
.actionbar kbd{background:transparent;color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.3)}

/* drawer */
.dr-h{position:sticky;top:0;z-index:3;background:var(--paper);display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dr-h h2{font-size:15px;margin:0;font-weight:650;flex:1;min-width:0}
.dr-h .scope{font-size:12px;color:var(--ink-2);font-weight:400;display:block;margin-top:1px}
.dr-b{padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.dr-f{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:3}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label,.fld>.lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.fld .help{font-size:12px;color:var(--ink-3)}
.txt{height:30px;border:1px solid var(--line-2);border-radius:6px;padding:0 8px;background:var(--paper);min-width:0}
.txt:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(37,70,201,.15)}
select.txt{padding-right:4px}
textarea.txt{height:auto;padding:8px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sentence{border:1px solid var(--line-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#FBFBFC}
.sl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px}
.sl select.txt{width:auto;max-width:100%}
.sl .sel-strong{font-weight:600}
.sl-strong{font-weight:600}
.prio{font-size:12px;color:var(--ink-3)}
.live{padding:10px 12px;border-radius:8px;background:#FFF8DB;border:1px solid #F0DC92;font-size:13px}
.live b{font-size:15px}
.live .err{color:var(--fail)}

/* filter builder */
.fb{display:flex;flex-direction:column;gap:6px}
.fb-group{display:flex;flex-direction:column;gap:6px}
.fb-group.nested{border:1px solid var(--line-2);background:var(--chrome);border-radius:8px;padding:8px}
.fb-group.nested .fb-group.nested{background:var(--paper)}
.fb-group.neg{box-shadow:inset 3px 0 0 var(--fail)}
.fb-negnote{font-size:11.5px;color:var(--fail);font-weight:600;padding-left:4px}
.fb-row{display:grid;grid-template-columns:52px minmax(0,1.1fr) minmax(0,.9fr) minmax(0,1.4fr) 22px;gap:5px;align-items:start}
.fb-group.nested{min-width:0}
.fb-row>.fb-group{grid-column:2/-1}
.fb-row>*{min-width:0}.fb-row select.txt{max-width:100%}
.fb-conj{height:28px;display:flex;align-items:center;font-size:12px;color:var(--ink-2)}
.fb-conj select{height:26px;border:1px solid var(--line-2);border-radius:5px;background:var(--paper);font-size:12px;padding:0 2px;width:50px}
.fb-row select.txt,.fb-row input.txt{height:28px;font-size:12px;width:100%}
.fb-val{min-width:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.fb-val .pct{display:flex;align-items:center;gap:3px;width:100%}
.fb-x{border:0;background:none;width:22px;height:28px;color:var(--ink-3);font-size:16px;border-radius:4px}
.fb-x:hover{background:var(--chrome-2);color:var(--fail)}
.fb-foot{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.fb-add{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;padding:3px 6px;border-radius:4px}
.fb-add:hover{background:var(--accent-tint)}
.fb-not{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);margin-left:auto}
.fb-delg{border:0;background:none;color:var(--ink-3);font-size:12px;padding:3px 6px;border-radius:4px}
.fb-delg:hover{color:var(--fail);background:#FBE3E0}
.fb-empty{font-size:12px;color:var(--ink-3);padding:2px 0}
.fb-errors:empty{display:none}
.fb-err{font-size:12px;color:var(--fail);background:#FBE3E0;padding:5px 8px;border-radius:5px}
.ctog{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.ctog button{border:0;padding:0;background:none;border-radius:50%;opacity:.35}
.ctog button.on{opacity:1}
.ctog button .pip{width:20px;height:20px;font-size:10px;margin:0}
.chip{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 4px 0 7px;border-radius:11px;background:var(--chrome-2);font-size:11.5px;text-transform:uppercase}
.chip button{border:0;background:none;padding:0 3px;color:var(--ink-3);font-size:13px;line-height:1}
.chip button:hover{color:var(--fail)}
.chip.on{background:var(--ink);color:#fff;text-transform:none}
.chip.off{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line-2);text-transform:none;padding:0 8px;cursor:pointer}
.chip.off.on{background:var(--ink);box-shadow:none}
.fb-val select.addset{width:auto;height:22px;font-size:11.5px;border-radius:11px;border:1px dashed var(--line-2);background:none;padding:0 4px}
.ce{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ce input{width:80px}

/* find drawer */
.res{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.res table{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.res th{background:var(--chrome);font-size:11.5px;color:var(--ink-2);text-align:left;padding:5px 6px;font-weight:600;position:sticky;top:0}
.res td{padding:0 6px;height:28px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res tr.pk td{background:var(--accent-tint)}
.res tbody tr{cursor:pointer}
.res tbody tr:hover td{background:#F7F8FA}
.res tbody tr.pk:hover td{background:#DFE6FC}
.res .nm{font:600 13px/1 var(--serif)}
.res-scroll{max-height:380px;overflow:auto}
.res-note{font-size:12px;color:var(--ink-2);padding:6px 8px;background:var(--chrome)}
.outchips{display:flex;flex-wrap:wrap;gap:4px}
.outchips .chip{text-transform:none;background:#FBE3E0}
.inchips .chip{text-transform:none;background:var(--accent-tint)}
.preview-list{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.preview-list .pl{display:flex;gap:8px;align-items:center}
.preview-list .pl .arrow{color:var(--ink-3)}

/* changes */
.chg-sum{display:flex;gap:18px}
.chg-list{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.chg-list h3{margin:0;font-size:12px;padding:6px 10px;background:var(--chrome);display:flex;justify-content:space-between;color:var(--ink-2)}
.chg-row{display:grid;grid-template-columns:minmax(0,1fr) 44px 80px;gap:6px;align-items:center;padding:0 6px 0 10px;height:30px;border-top:1px solid var(--line)}
.chg-row .nm{font:600 13px/1 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chg-row .set{font-size:11.5px;color:var(--ink-3);text-transform:uppercase}
.chg-scroll{max-height:260px;overflow:auto}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.state.dirty{color:var(--accent)} .state.clean{color:var(--ok)}
.src{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:12.5px}
.src dt{font-weight:600;color:var(--ink-2)}
.src dd{margin:0}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;align-items:center}
.keys div:nth-child(odd){text-align:right}

/* preview image */
#preview{position:fixed;z-index:50;pointer-events:none;display:none;width:244px;border-radius:11px;overflow:hidden;box-shadow:0 10px 30px rgba(20,25,40,.35);background:var(--chrome-2)}
#preview img{display:block;width:244px;height:340px;object-fit:cover}
#preview.on{display:block}

/* toast */
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 10px 8px 14px;border-radius:8px;display:none;align-items:center;gap:12px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13px}
#toast.on{display:flex}
#toast button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:5px;height:24px;padding:0 8px;font-size:12px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(20,25,40,.4);display:none;place-items:center;z-index:40}
#modal.on{display:grid}
.mbox{background:var(--paper);border-radius:12px;width:440px;max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox .dr-h{border-radius:12px 12px 0 0}
.mbox .dr-f{border-radius:0 0 12px 12px}
.mbox.wide{width:1080px}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.mcols h3{font-size:13px;margin:0 0 6px;display:flex;align-items:center;gap:6px}
.mlist{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.mlist td{padding:3px 4px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlist td:first-child{width:42%}.mlist td:nth-child(2){width:70px}.mlist td.num{width:56px;text-align:right}
.mlist .nm{font:600 13px/1 var(--serif)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.mgrid figure{margin:0}.mgrid img{width:100%;aspect-ratio:488/680;border-radius:5px;display:block;background:var(--chrome-2)}
.mgrid figcaption{font-size:11px;color:var(--ink-2);text-align:right}
@media (max-width:900px){.mcols{grid-template-columns:1fr}}

/* overview */
#overview{position:fixed;inset:var(--top,48px) 0 0 0;background:var(--chrome);overflow:auto;display:none;z-index:20}
#overview.on{display:block}
.ov{display:grid;grid-template-columns:minmax(560px,1fr) 440px;gap:24px;max-width:1240px;margin:0 auto;padding:22px 24px 40px}
.ov-star{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative}
.ov-star h2{margin:0 0 2px;font-size:16px}
.ov-star p{margin:0;color:var(--ink-2);font-size:12.5px;max-width:62ch}
.ov-star svg{display:block;width:100%;height:auto;max-height:calc(100vh - 190px)}
.ov-star .chord{cursor:pointer}
.ov-star .chord:hover .line,.ov-star .chord.hl .line{stroke-width:9}
.ov-star .chord:hover .badge,.ov-star .chord.hl .badge{stroke-width:3}
.ov-star .cnode{cursor:pointer}
.ov-key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.ov-key span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ov-side{display:flex;flex-direction:column;gap:14px}
.ov-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ov-card>h3{margin:0;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.ov-row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.ov-card>h3+.ov-row{border-top:0}
.ov-row:hover,.ov-row.hl{background:#F7F8FA}
.ov-row .nm{font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.ov-row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-row .why{grid-column:2/-1;font-size:12px;color:var(--ink-2);margin-top:-2px}
.ov-row .why .f{color:var(--fail)} .ov-row .why .n{color:var(--near)} .ov-row .why .w{color:var(--warn)}
.save-rules{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.save-rules h4{margin:0;font-size:13px}
.savemodes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.savemode{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12.5px;cursor:pointer}
.savemode:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
@media (max-width:900px){.savemodes{grid-template-columns:1fr}}
.save-rules p{margin:0;font-size:12.5px;color:var(--ink-2);max-width:90ch}
.block-raw{font:11.5px/1.4 ui-monospace,Menlo,monospace;height:auto;padding:8px;word-break:break-all;background:#FBFBFC}
.check-block summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600}
.mdpre{font:11px/1.4 ui-monospace,Menlo,monospace;background:var(--chrome);padding:8px;border-radius:6px;white-space:pre-wrap;word-break:break-all;max-height:120px;overflow:auto}
.ov-about{max-width:1240px;margin:0 auto;padding:0 24px 40px}
.about-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.about-panes{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:320px}
.about-prev{padding:12px 16px;border-right:1px solid var(--line);max-height:520px;overflow:auto;font-size:13px;line-height:1.5}
.res-note{display:flex;align-items:center;gap:10px;justify-content:space-between}.colpick{position:relative;flex:none}.colpick summary{cursor:pointer;font-size:12px;color:var(--ink-2);list-style:none;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg,#fff)}.colpick summary::-webkit-details-marker{display:none}.colpick-menu{position:absolute;right:0;top:calc(100% + 4px);z-index:30;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(20,30,50,.14);padding:8px 10px;display:grid;gap:4px;min-width:200px;font-size:12.5px}.colpick-menu label{display:flex;gap:6px;align-items:center;white-space:nowrap}.help-h{font-size:13px;margin:14px 0 6px}.help-h:first-child{margin-top:0}.fr-agents{font-size:12.5px;margin-top:14px;line-height:1.5}
.about-prev h1{font-size:18px;margin:0 0 8px}.about-prev h2{font-size:15px;margin:14px 0 6px}.about-prev h3{font-size:13.5px;margin:12px 0 4px;display:flex;align-items:center;gap:6px}.about-prev h4{font-size:13px;margin:10px 0 4px}
.about-prev p{margin:0 0 8px}.about-prev ul{margin:0 0 8px;padding-left:20px}
.about-raw{border:0;border-radius:0;height:auto;min-height:320px;max-height:520px;font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px 14px;resize:vertical;background:#FBFBFC}
@media (max-width:900px){.about-panes{grid-template-columns:1fr}}
.ov-row .r{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* first run */
#firstRun{position:fixed;inset:0;background:var(--chrome);z-index:80;display:none;overflow:auto}
#firstRun.on{display:block}
.fr{max-width:760px;margin:0 auto;padding:56px 24px}
.fr h1{font:650 28px/1.15 var(--sans);margin:14px 0 6px;letter-spacing:-.01em}
.fr .lead{color:var(--ink-2);font-size:14.5px;margin:0 0 26px;max-width:60ch}
.fr-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.fr-card h2{font-size:15px;margin:0 0 4px}
.fr-card p{margin:0 0 12px;color:var(--ink-2);font-size:13px;max-width:64ch}
.fr-tabs{display:flex;gap:4px;margin-bottom:12px}
.fr-tabs button{border:1px solid var(--line-2);background:var(--paper);border-radius:6px;height:30px;padding:0 12px}
.fr-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fr textarea{width:100%;height:180px;font:12.5px/1.45 ui-monospace,Menlo,monospace}
.fr .note{background:var(--chrome);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-2);margin-top:10px}
.refrow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.fr-found{margin-top:10px;padding:12px 14px;border-radius:8px;background:#E9F4EE;border:1px solid #B7DCC5;font-size:13px}
.fr-found .choice button{background:var(--paper)}
.fr .unmatched{max-height:110px;overflow:auto;font-size:12px;color:var(--fail);margin-top:6px}
.fr .steps{display:flex;gap:8px;font-size:12px;color:var(--ink-3);margin-bottom:6px}
.fr .steps .on{color:var(--ink);font-weight:600}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{text-align:left;border:1px solid var(--line-2);background:var(--paper);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.choice button:hover{border-color:var(--accent);background:var(--accent-tint)}
.choice button b{font-size:14px}
.choice button span{color:var(--ink-2);font-size:12.5px}
/* ---------- responsive ---------- */
.side-btn{display:none}
.l-short{display:none}
@media (max-width:1240px){.l-long{display:none}.l-short{display:inline}.top .sizeinfo b+b{}}
.side-close{display:none}
#backdrop{display:none;position:fixed;inset:var(--top,48px) 0 0 0;background:rgba(20,25,40,.35);z-index:28}
/* the sidebar becomes a drawer below 1100 px, or below 1400 px while a panel is open */
body.compact-side .body{grid-template-columns:minmax(0,1fr) auto}
body.compact-side .side{position:fixed;left:0;top:var(--top,48px);bottom:0;width:min(320px,88vw);z-index:30;transform:translateX(-102%);transition:transform .18s ease;box-shadow:4px 0 24px rgba(20,25,40,.18)}
body.compact-side.side-open .side{transform:none}
body.compact-side.side-open #backdrop{display:block;z-index:29}
body.compact-side .side-btn{display:inline-flex}
body.compact-side .side-close{display:flex;justify-content:flex-end;padding:2px 2px 0}
@media (max-width:1100px){
  .drawer.open{position:fixed;right:0;top:var(--top,48px);bottom:0;width:min(520px,100vw);z-index:32;box-shadow:-6px 0 28px rgba(20,25,40,.22)}
  body.drawer-open #backdrop{display:block;z-index:31}
  .ov{grid-template-columns:minmax(0,1fr);padding:16px}
  .ov-about{padding:0 16px 32px}
}
@media (max-width:1100px),(max-height:860px){
  .main{display:block;overflow:auto;position:relative}
  .tablewrap{overflow:visible}
  .grid th{top:0}
  .actionbar{position:sticky;bottom:0;z-index:4}
}
.top-break{display:none}
@media (max-width:900px){
  .top .brand{order:1}.top #viewSeg{order:2}.top .spacer{order:3}.top #btnAdd{order:4}.top #btnChanges{order:5}
  .top .top-break{display:block;order:6;flex-basis:100%;height:0}
  .top .sizeinfo{order:7}.top #scaleSeg{order:8}.top #btnData{order:9;margin-left:auto}.top #btnKeys{order:10}
  .actionbar kbd,.rulebox kbd{display:none}
  .shead{padding:10px 12px}
  .toolbar{padding:8px 12px}
  .rulebox{grid-template-columns:minmax(0,1fr)}
  .rulebox .ract{justify-content:flex-start}
}
@media (max-width:640px){
  .top{gap:6px;padding:6px 8px}
  .brand{margin-right:0}
  #btnData,#btnKeys{display:none}
  .shead h1{font-size:16px}
  .curve,.stat.hide-sm{display:none}
  .stats{gap:12px}
  .choice{grid-template-columns:1fr}
  .fr{padding:24px 14px}
  .fr h1{font-size:22px}
  .cardgrid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px 10px;padding:12px}
  .fb-row{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) 22px}
  .fb-row>.fb-x{grid-column:4;grid-row:1}
  .fb-row>.fb-val{grid-column:2/4;grid-row:2}

    <textarea class="txt block-raw" readonly rows="3" aria-label="cubewarden rules">${esc(text)}</textarea>

async function checkPasted() {

/* ================= first run: import ================= */
const NAME_IDX = (() => { const m = new Map(); for (const c of D.cards) { m.set(c.name.toLowerCase(), c.id); if (c.name.includes(" // ")) m.set(c.name.split(" // ")[0].toLowerCase(), c.id); } return m; })();
function parseList(text) {
  const ids = [], missing = [];
  for (let line of text.split(/\r?\n/)) {
    line = line.trim();
    if (!line || /^(#|\/\/)/.test(line)) continue;
    line = line.replace(/^\d+\s*x?\s+/i, "").replace(/\s+\*[A-Z]+\*$/, "").replace(/\s+\([A-Za-z0-9]{2,6}\)(\s+[\w-]+)?$/, "").trim();
    const id = NAME_IDX.get(line.toLowerCase()) || NAME_IDX.get(line.split(/\s*\/\/?\s*/)[0].toLowerCase());
    if (id) { if (!ids.includes(id)) ids.push(id); } else missing.push(line);
  }
  return { ids, missing };
}
function emptyConfig(name, target) {
  return { version: 1, cube: Object.assign({ name: name || "My cube" }, target ? { targetSize: target } : {}), colors: D.seed.colors.map((c) => ({ code: c.code, mechanics: [] })), archetypes: [], rules: [] };
}

      <div class="fr-card"><div class="row" style="gap:16px"><div class="fld" style="flex:1"><label for="frName">Cube name</label><input class="txt" id="frName" value="${esc(p.name || "My cube")}"></div><div class="fld" style="width:190px"><label for="frTarget">Target size (optional)</label><input class="txt" id="frTarget" type="number" placeholder="e.g. 360"></div></div></div>

      ${p.tags && Object.keys(p.tags).length ? `<label class="fr-card row" style="gap:10px;margin-top:12px;cursor:pointer"><input type="checkbox" id="frTagMech" checked><span><b>Also create one mechanic per CubeCobra tag</b> (${new Set(Object.values(p.tags).flat()).size} tags). A tag like “UG Ramp” goes into the archetype with those colours (one is created, unnamed, if missing); “U Counterspells” into Blue; others become count rules on the whole cube, to move later.</span></label>` : ""}
      <p class="muted" style="margin-top:14px"><button class="btn ghost sm" id="frBack">Back</button></p></div>`;
    const start = (cfg) => {
      if (p.source) cfg.cube.cubeCobraId = p.source.id;

    };
    $("#frEmpty").onclick = () => start(emptyConfig());
    $("#frCopy").onclick = () => start(clone(D.seed));
    $("#frBack").onclick = () => renderFirstRun("import", p.source ? "cc" : "paste");
    return;
  }
  const tab = payload || "paste";
  fr.innerHTML = `<div class="fr">${logo}<div class="steps"><span class="on">1. Import</span><span>2. Rules</span></div>
    <h1>Balance your cube against your own rules</h1>
    <p class="lead">Import a cube, write the rules it should meet for the whole cube, each colour and each archetype, then edit the list until they pass. You get a changelist to apply on CubeCobra.</p>
    <div class="fr-card"><div class="fr-tabs"><button data-tab="paste" class="${tab === "paste" ? "on" : ""}">Paste a card list</button><button data-tab="cc" class="${tab === "cc" ? "on" : ""}">From CubeCobra</button></div>
      ${tab === "paste" ? `<p>One card per line. Quantities, set codes and collector numbers are ignored ("1 Lightning Bolt (FDN) 123" works).</p>

        <div class="unmatched" id="frMissing"></div>`

    </div>
    <div class="fr-card"><h2>Open the cube in this folder</h2><p>${esc(D.cube.name)}: ${D.cube.current.length} cards with ${D.seed.rules.length} rules and ${D.seed.archetypes.length} archetypes, from the project files cubewarden serves.</p><button class="btn primary" id="frDemo">Open ${esc(D.cube.name)}</button></div>
    <p class="muted fr-agents">cubewarden is open source: <a href="${E.REPO_URL}" target="_blank" rel="noopener">${E.REPO_URL.replace("https://", "")}</a>. Run it on your computer (<code>npx cubewarden serve</code>) and AI agents can work on the same cube: in this page through <code>window.cubewarden</code> or WebMCP, or from a terminal with the <code>cubewarden</code> command. See <a href="llms.txt">llms.txt</a>.</p></div>`;
  fr.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => renderFirstRun("import", b.dataset.tab)));
  $("#frDemo").onclick = () => { Object.assign(S, demoState()); U.scope = { kind: "cube" }; U.sel = null; U.view = "work"; save(); fr.classList.remove("on"); recompute(); renderAll(); };
  if (tab === "paste") {
    $("#frSample").onclick = () => { $("#frList").value = D.cube.current.slice(0, 40).map((id) => "1 " + byId[id].name).join("\n") + "\nNot A Real Card"; };

/** "https://cubecobra.com/cube/overview/abc?x" or "abc" → "abc". */
function parseCubeId(text) {
  const t = String(text || "").trim();
  const m = t.match(/cubecobra\.com\/cube\/(?:[a-z]+\/)*?(?:list|overview|about|playtest|analysis|history|primer|records|blog|samplepack)\/([^/?#\s]+)/i) || t.match(/cubecobra\.com\/c\/([^/?#\s]+)/i);
  if (m) return decodeURIComponent(m[1]);
  return /^[A-Za-z0-9_-]+$/.test(t) ? t : null;
}
/** Like CubeEngine.fetchCubeCobra, but keeps card names so unknown cards can be listed. */
async function readCubeCobra(id) {
  const res = await fetch("https://cubecobra.com/cube/api/cubeJSON/" + encodeURIComponent(id));
  if (res.status === 404) throw new Error("No public cube with this id on CubeCobra.");
  if (!res.ok) throw new Error("CubeCobra answered " + res.status + ".");
  const d = await res.json();
  const board = (b) => ((d.cards && d.cards[b]) || []).map((c) => ({ id: c.details && c.details.oracle_id, name: (c.details && c.details.name) || c.name || "?" })).filter((c) => c.id);
  const texts = [d.description || ""].concat((d.primerTabs || []).map((t) => t.content || ""));
  let config = null, where = null, bad = null;
  for (let i = 0; i < texts.length; i++) {
    try { config = await E.decodeConfig(texts[i]); } catch (e) { bad = e.message; config = null; }
    if (config) { where = i === 0 ? "the overview" : `the primer tab "${(d.primerTabs[i - 1].name || d.primerTabs[i - 1].title || "untitled")}"`; break; }
  }
  const tagsById = {};
  for (const c of (d.cards && d.cards.mainboard) || []) if (c.details && c.details.oracle_id && c.tags && c.tags.length) tagsById[c.details.oracle_id] = c.tags.map(String);
  return { id, name: d.name || id, description: d.description || "", mainboard: board("mainboard"), maybeboard: board("maybeboard"), config, where, bad, tagsById };
}
function configStats(cfg) {
  return { rules: (cfg.rules || []).length, archetypes: (cfg.archetypes || []).length, mechanics: (cfg.colors || []).reduce((n, c) => n + (c.mechanics || []).length, 0) + (cfg.archetypes || []).reduce((n, a) => n + (a.mechanics || []).length, 0) };
}
async function importFromCubeCobra(text) {
  const out = $("#frCCOut"), id = parseCubeId(text);
  if (!id) { out.innerHTML = `<div class="note" style="color:var(--fail)">That doesn't look like a CubeCobra address or id.</div>`; return; }
  out.innerHTML = `<div class="note">Reading cube ${esc(id)} from CubeCobra…</div>`;
  let cc;
  try { cc = await readCubeCobra(id); }
  catch (e) { out.innerHTML = `<div class="note" style="color:var(--fail)">Could not read the cube: ${esc(e.message === "Failed to fetch" ? "the request was blocked or you are offline." : e.message)} Check the address, or load the demo below.</div>`; return; }
  const seen = new Set(), known = [], unknown = [];
  let dup = 0;
  for (const c of cc.mainboard) { if (seen.has(c.id)) { dup++; continue; } seen.add(c.id); (byId[c.id] ? known : unknown).push(c); }
  const ids = known.map((c) => c.id);
  const src = { id: cc.id, name: cc.name, at: new Date().toISOString() };
  const cfgSt = cc.config ? configStats(cc.config) : null;
  const saved = cc.config && cc.config.savedAt ? new Date(cc.config.savedAt) : null;
  out.innerHTML = `<div class="note" style="color:var(--ink)"><b>${esc(cc.name)}</b>: ${cc.mainboard.length} cards in the mainboard${cc.maybeboard.length ? `, ${cc.maybeboard.length} in the maybeboard (ignored)` : ""}${dup ? `, ${dup} duplicate${dup > 1 ? "s" : ""} counted once` : ""}.
    ${(() => { const n = new Set(Object.values(cc.tagsById || {}).flat()).size; return n ? `<br>${n} CubeCobra tag${n > 1 ? "s" : ""} found on ${Object.keys(cc.tagsById).length} cards${cc.config ? "" : ": the next step can turn them into mechanics"}.` : ""; })()}
    <br>${known.length} known to cubewarden${unknown.length ? `, <span style="color:var(--fail)">${unknown.length} unknown</span> (the card data only covers the pool you built): ${unknown.slice(0, 30).map((c) => esc(c.name)).join(", ")}${unknown.length > 30 ? "…" : ""}` : "."}</div>
    ${cc.config ? `<div class="fr-found"><b>Rules found in this cube</b>${saved && !isNaN(saved) ? `, saved ${esc(saved.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }))}` : ""}, in ${esc(cc.where)}: ${cfgSt.rules} rules, ${cfgSt.archetypes} archetypes, ${cfgSt.mechanics} mechanics.
      <div class="choice" style="margin-top:10px"><button id="ccRestore"><b>Restore them</b><span>Your rules, archetypes, descriptions and target size, as saved.</span></button><button id="ccRules"><b>Start empty or from the demo rules</b><span>Ignore the saved block and choose on the next step.</span></button></div></div>`
      : cc.bad ? `<div class="note" style="color:var(--fail)">A cubewarden block was found but it is damaged, probably changed while pasting. Continue to set up rules.</div>` : `<div class="note">No saved cubewarden rules in this cube. You can save them later from Overview, About for CubeCobra.</div>`}
    ${known.length ? `<div class="row" style="margin-top:10px">${cc.config ? "" : `<button class="btn primary" id="ccNext">Continue with ${known.length} cards</button>`}</div>` : `<div class="note" style="color:var(--fail)">None of the cards are in the card data. Build it for this cube with <code>cubewarden data build</code>.</div>`}`;
  if (!known.length) { if ($("#ccRestore")) $("#ccRestore").disabled = true; return; }
  const tagsKnown = Object.fromEntries(Object.entries(cc.tagsById || {}).filter(([id]) => byId[id]));
  const payload = { ids, name: cc.name, source: src, tags: tagsKnown };
  if ($("#ccNext")) $("#ccNext").onclick = () => renderFirstRun("rules", payload);
  if ($("#ccRules")) $("#ccRules").onclick = () => renderFirstRun("rules", payload);
  if ($("#ccRestore")) $("#ccRestore").onclick = () => {
    const cfg = clone(cc.config); normaliseConfig(cfg);
    if (!cfg.cube.name) cfg.cube.name = cc.name;
    cfg.cube.cubeCobraId = cfg.cube.cubeCobraId || cc.id;
    Object.assign(S, { version: 1, config: cfg, original: ids.slice(), current: ids.slice(), started: true, exportedSig: null, source: src, ccTags: tagsKnown });
    applyCcTags();
    U.scope = { kind: "cube" }; U.sel = null; U.view = "work";
    save(); $("#firstRun").classList.remove("on"); recompute(); renderAll();
    toast(`Restored ${cfgSt.rules} rules and ${cfgSt.archetypes} archetypes from CubeCobra`);
  };
}

/* ================= boot ================= */
(function init() {
  const tags = new Set(), kws = new Set();
  D.cards.forEach((c) => { c.tags.forEach((t) => tags.add(t)); c.keywords.forEach((k) => kws.add(k)); });

  $("#dl-kw").innerHTML = [...kws].sort().map((t) => `<option value="${esc(t)}">`).join("");
  setTopVar(); recompute(); renderAll(); loadRefs();
  // Agents driving this browser: window.cubewarden (and WebMCP tools where the browser supports them).
  window.cubewardenAttach(S, byId, { scale: () => U.scale, changed: () => { save(); recompute(); renderAll(); } });
  if (!S.started) renderFirstRun("import");
  else if (migratedShared) { save(); toast("Your per-archetype gold, hybrid and WR rules are now 3 shared rules under All archetypes"); }
})();
