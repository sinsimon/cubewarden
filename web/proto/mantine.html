<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cubewarden mockup: Mantine</title>
<meta name="color-scheme" content="light dark">
<script>
  // Same as Mantine's ColorSchemeScript with defaultColorScheme="auto": no flash before React mounts.
  document.documentElement.setAttribute("data-mantine-color-scheme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
<link rel="stylesheet" href="mantine.css">
<style>
  /* Only what Mantine has no prop for: status glyphs, mana pips, tree rows, highlighted rows, dense table. */
  :root { --hit: var(--mantine-color-blue-light); --hit-edge: var(--mantine-color-blue-filled); --line: var(--mantine-color-default-border); --muted: var(--mantine-color-dimmed); }
  /* Mantine's default "dimmed" grey is below 4.5:1 on its own backgrounds; one shade stronger in each scheme. */
  :root[data-mantine-color-scheme="light"] { --mantine-color-dimmed: var(--mantine-color-gray-7); }
  :root[data-mantine-color-scheme="dark"] { --mantine-color-dimmed: var(--mantine-color-dark-1); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .side { background: var(--mantine-color-body); }
  [data-mantine-color-scheme="light"] .side { background: var(--mantine-color-gray-0); }
  .tnode { min-height: 26px; padding-right: 8px; border-radius: var(--mantine-radius-sm); cursor: default; font-size: 13px; }
  .tnode:hover { background: var(--mantine-color-default-hover); }
  .tnode.on { background: var(--mantine-color-blue-light); box-shadow: inset 3px 0 0 var(--mantine-color-blue-filled); }
  .tnode.section { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-top: 6px; }
  .tnode .chev { width: 12px; flex: none; color: var(--muted); transition: transform .12s; }
  .tnode .chev.open { transform: rotate(90deg); }
  .tnode .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tnode .ct { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .st { width: 8px; height: 8px; flex: none; display: inline-block; }
  .st.pass { background: var(--mantine-color-green-filled); border-radius: 50%; }
  .st.warn { background: var(--mantine-color-orange-filled); border-radius: 1px; }
  .st.fail { background: var(--mantine-color-red-filled); transform: rotate(45deg) scale(.85); }
  .pips { display: inline-flex; gap: 2px; }
  .pip { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; font-size: 9px; font-weight: 700; color: #1b1b1b; border: 1px solid rgb(0 0 0 / .25); box-sizing: border-box; line-height: 1; }
  .pip.W { background: #f8f2d4; } .pip.U { background: #b4d3ea; } .pip.B { background: #bcb4b0; } .pip.R { background: #f0a98c; } .pip.G { background: #9fd1ad; } .pip.C, .pip.N { background: #d6d3cf; }
  .pips.big .pip { width: 22px; height: 22px; font-size: 12px; }

  .content { padding: 14px 20px 40px; min-width: 0; }
  .crumbs { font-size: 13px; }
  .crumb { color: var(--muted); padding: 2px 4px; border-radius: 4px; font-size: 13px; }
  .crumb:hover { color: var(--mantine-color-text); background: var(--mantine-color-default-hover); }
  .crumb.current { color: var(--mantine-color-text); font-weight: 500; }
  .sib { color: var(--muted); padding: 2px 4px; border-radius: 4px; display: inline-grid; place-items: center; }
  .sib:hover { background: var(--mantine-color-default-hover); }
  .rules { margin-bottom: 12px; }
  .chip-label { display: inline-flex !important; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; padding-inline: 6px 10px !important; }
  .chip-label > span:last-child { display: inline-flex; align-items: center; gap: 5px; }
  .chip-label .ring { display: inline-flex; flex: none; }
  .chip-icon { display: none; }
  .chip-label .n { color: var(--muted); }
  .chip-label .g.pass { color: var(--mantine-color-green-text); } .chip-label .g.warn { color: var(--mantine-color-orange-text); } .chip-label .g.fail { color: var(--mantine-color-red-text); }
  .search { flex: 1 1 260px; max-width: 420px; }
  .tablewrap { overflow-x: auto; contain: inline-size; }
  .cards { font-size: 13px; }
  .cards th { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .cards td { white-space: nowrap; }
  .cards .num { text-align: right; font-variant-numeric: tabular-nums; }
  .cards .num .sortbtn { justify-content: flex-end; }
  .cards .sel { width: 30px; padding-right: 0; }
  .sortbtn { display: inline-flex; gap: 4px; align-items: center; font: inherit; color: inherit; font-weight: 600; }
  .sortbtn .arrow { font-size: 9px; width: 8px; }
  .cards td.name { font-weight: 500; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .cards td.type { color: var(--muted); max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .cards td.hitcell { color: var(--mantine-color-blue-text); font-weight: 600; }
  .cards tr.hit td { background: var(--hit); }
  .cards tr.hit td:first-child { box-shadow: inset 3px 0 0 var(--hit-edge); }
  .cards td.empty { text-align: center; color: var(--muted); padding: 24px; }
  @media (max-width: 1100px) { .col-raw, .col-set { display: none; } }
  @media (max-width: 600px) {
    .content { padding: 10px 12px 32px; }
    .col-type, .col-cost { display: none; }
    .cards td.name { max-width: 150px; }
    .rules { overflow-x: auto; contain: inline-size layout paint; }
    .chips { flex-wrap: nowrap; padding: 2px; }
  }
</style>
</head>
