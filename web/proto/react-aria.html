<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cubewarden mockup: React Aria</title>
<meta name="color-scheme" content="light dark">
<style>
  /* React Aria ships behaviour only: every pixel below is ours. Neutral, dense, Airtable-like. */
  :root {
    --bg: #ffffff; --panel: #f7f7f8; --sunken: #f1f1f3; --fg: #1d1f24; --muted: #5c6370; --line: #e3e4e8; --line-strong: #c9ccd3;
    --accent: #2563eb; --accent-fg: #ffffff; --hit: #eaf1ff; --hit-edge: #2563eb; --hover: #f3f4f6; --sel: #e8eefc;
    --pass: #16a34a; --warn: #d97706; --fail: #dc2626; --pass-fg: #15803d; --warn-fg: #b45309; --fail-fg: #b91c1c;
    --fail-bg: #fde8e8; --warn-bg: #fdf1dc; --pass-bg: #e3f6e8;
    --focus: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    --radius: 6px;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b; --panel: #1d1f23; --sunken: #23262b; --fg: #e7e8ea; --muted: #9ba1ab; --line: #2e3137; --line-strong: #454a52;
      --accent: #6b9cff; --accent-fg: #0d1117; --hit: #1b2a47; --hit-edge: #6b9cff; --hover: #24272c; --sel: #22304d;
      --pass: #34c06a; --warn: #f0a83a; --fail: #f26363; --pass-fg: #5fd48a; --warn-fg: #f5b95c; --fail-fg: #ff8a8a;
      --fail-bg: #3b1d1f; --warn-bg: #3a2a12; --pass-bg: #163222;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  [data-focus-visible] { outline: none; box-shadow: var(--focus); }

  .shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); grid-template-rows: 44px 1fr; min-height: 100vh; }
  .appbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .brand { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .views { display: flex; gap: 2px; }
  .view { padding: 4px 10px; border-radius: var(--radius); color: var(--muted); text-decoration: none; }
  .view[aria-current="page"] { background: var(--sunken); color: var(--fg); font-weight: 500; }
  .view[data-hovered] { color: var(--fg); }
  .spacer { flex: 1; }
  .meta { color: var(--muted); white-space: nowrap; }
  .btn { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 4px 10px; cursor: default; white-space: nowrap; }
  .btn[data-hovered] { background: var(--hover); }
  .btn[data-pressed] { background: var(--sunken); }
  .pillcount { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-size: 11px; line-height: 16px; }
  .iconbtn { font: inherit; display: inline-grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: var(--radius); background: transparent; color: var(--muted); }
  .iconbtn[data-hovered] { background: var(--hover); color: var(--fg); }
  .menu { display: none; width: 30px; height: 30px; }
  .switch { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
  .switch .track { width: 26px; height: 16px; border-radius: 999px; background: var(--line-strong); position: relative; transition: background .15s; }
  .switch .thumb { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch[data-selected] .track { background: var(--accent); }
  .switch[data-selected] .thumb { transform: translateX(10px); }
  .switch[data-focus-visible] { box-shadow: none; }
  .switch[data-focus-visible] .track { box-shadow: var(--focus); }

  /* Tree */
  .side { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; position: sticky; top: 44px; height: calc(100vh - 44px); padding: 8px 6px; }
  .tree { outline: none; }
  .ti { display: flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 8px 0 calc((var(--tree-item-level) - 1) * 14px + 2px); border-radius: var(--radius); cursor: default; outline: none; }
  .ti[data-hovered] { background: var(--hover); }
  .ti[data-selected] { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  .ti[data-focus-visible] { box-shadow: inset 0 0 0 2px var(--accent); }
  .ti.section { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-top: 6px; }
  .ti .chev { width: 16px; height: 16px; display: inline-grid; place-items: center; border: 0; padding: 0; background: none; color: var(--muted); flex: none; border-radius: 4px; }
  .ti .chev svg { transition: transform .12s; }
  .ti[data-expanded] .chev svg { transform: rotate(90deg); }
  .ti .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ti .ct { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .st { width: 8px; height: 8px; flex: none; display: inline-block; }
  .st.pass { background: var(--pass); border-radius: 50%; }
  .st.warn { background: var(--warn); border-radius: 1px; }
  .st.fail { background: var(--fail); transform: rotate(45deg) scale(.85); }
  .pips { display: inline-flex; gap: 2px; }
  .pip { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; font-size: 9px; font-weight: 700; color: #1b1b1b; border: 1px solid rgb(0 0 0 / .25); line-height: 1; }
  .pip.W { background: #f8f2d4; } .pip.U { background: #b4d3ea; } .pip.B { background: #bcb4b0; } .pip.R { background: #f0a98c; } .pip.G { background: #9fd1ad; } .pip.C, .pip.N { background: #d6d3cf; }
  .pips.big .pip { width: 22px; height: 22px; font-size: 12px; }

  /* Mobile sheet */
  .overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .4); z-index: 20; }
  .sheet { position: fixed; inset: 0 auto 0 0; width: min(320px, 88vw); background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px 6px; }
  .sheet-dialog { outline: none; }

  /* Header */
  .content { padding: 14px 20px 40px; min-width: 0; }
  .crumbs { display: flex; align-items: center; gap: 2px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
  .crumbs li { display: inline-flex; align-items: center; gap: 0; }
  .crumbs li:not(:last-child)::after { content: "/"; color: var(--line-strong); margin: 0 6px; }
  .crumb { color: var(--muted); text-decoration: none; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
  .crumb[data-hovered] { color: var(--fg); background: var(--hover); }
  .crumb[data-current] { color: var(--fg); font-weight: 500; cursor: default; }
  .iconbtn.sib { width: 18px; height: 20px; }
  .popover { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / .14); padding: 4px; min-width: 200px; max-height: 360px; overflow-y: auto; }
  .menu-list { outline: none; }
  .mi { padding: 5px 10px; border-radius: 4px; outline: none; cursor: default; }
  .mi[data-focused] { background: var(--hover); }
  .titlebar { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; flex-wrap: wrap; }
  .titlebar h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -.01em; }
  .badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
  .badge.fail { background: var(--fail-bg); color: var(--fail-fg); } .badge.warn { background: var(--warn-bg); color: var(--warn-fg); } .badge.pass { background: var(--pass-bg); color: var(--pass-fg); }
  .desc { margin: 0 0 12px; color: var(--muted); }
  .rules { margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; outline: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 7px; border: 1px solid var(--line-strong); border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; cursor: default; outline: none; }
  .chip[data-hovered] { background: var(--hover); }
  .chip[data-selected] { border-color: var(--accent); background: var(--sel); box-shadow: inset 0 0 0 1px var(--accent); }
  .chip[data-focus-visible] { box-shadow: var(--focus); }
  .chip .n { color: var(--muted); }
  .chip .g.pass { color: var(--pass-fg); } .chip .g.warn { color: var(--warn-fg); } .chip .g.fail { color: var(--fail-fg); }
  .ring { width: 14px; height: 14px; transform: rotate(-90deg); flex: none; }
  .ring .track { stroke: var(--line); }
  .ring.pass .ind { stroke: var(--pass); } .ring.warn .ind { stroke: var(--warn); } .ring.fail .ind { stroke: var(--fail); }

  /* Table */
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .search { flex: 1 1 260px; max-width: 420px; display: flex; }
  .search input { flex: 1; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 5px 10px; min-width: 0; }
  .search input::placeholder { color: var(--muted); }
  .search input[data-focused] { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .search input::-webkit-search-cancel-button { display: none; }
  .count { color: var(--muted); margin-left: auto; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); contain: inline-size; }
  .cards { width: 100%; border-collapse: collapse; outline: none; }
  .cards th, .cards td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; height: 28px; outline: none; }
  .cards th { position: sticky; top: 0; background: var(--panel); font-weight: 600; font-size: 12px; color: var(--muted); }
  .cards th[data-allows-sorting] { cursor: default; }
  .cards th[data-hovered] { color: var(--fg); }
  .cards th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; }
  .cards th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
  .cards .num { text-align: right; font-variant-numeric: tabular-nums; }
  .cards .sel { width: 30px; padding-right: 0; }
  .cards td.name { font-weight: 500; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .cards td.type { color: var(--muted); max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  .cards td.hitcell { color: var(--accent); font-weight: 600; }
  .cards .row[data-hovered] td { background: var(--hover); }
  .cards .row.hit td { background: var(--hit); }
  .cards .row.hit td:first-child { box-shadow: inset 3px 0 0 var(--hit-edge); }
  .cards .row[data-selected] td { background: var(--sel); }
  .cards .row[data-focus-visible] td { box-shadow: inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent); }
  .cards td[data-focus-visible] { box-shadow: inset 0 0 0 2px var(--accent); }
  .cards tbody td[colspan] { text-align: center; color: var(--muted); padding: 24px; }
  .cb { display: inline-flex; }
  .box { width: 14px; height: 14px; border: 1.5px solid var(--line-strong); border-radius: 3px; display: inline-grid; place-items: center; background: var(--bg); color: var(--accent-fg); }
  .box svg { width: 10px; height: 10px; }
  .cb[data-selected] .box, .cb[data-indeterminate] .box { background: var(--accent); border-color: var(--accent); }
  .cb[data-focus-visible] .box { box-shadow: var(--focus); }

  @media (max-width: 1100px) { .col-raw, .col-set { display: none; } }
  @media (max-width: 900px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .side { display: none; }
    .menu { display: inline-grid; }
    .meta { display: none; }
  }
  @media (max-width: 600px) {
    .content { padding: 10px 12px 32px; }
    .appbar { padding: 0 8px; gap: 8px; }
    .views, .switch { display: none; }
    .col-type, .col-cost { display: none; }
    .cards td.name { max-width: 150px; }
    .rules { overflow-x: auto; contain: inline-size layout paint; }
    .chips { flex-wrap: nowrap; padding: 2px; }
  }
</style>
</head>
<body>
